[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-compare"
version = "0.1.0"
description = "Docker/Redis/Postgres orchestrator for the clinical coding harness comparison"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.9,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<7.0",
  "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["harness_compare*"]

[tool.setuptools.package-data]
harness_compare = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
